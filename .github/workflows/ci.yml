name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "opencv-python>=4.9,<5" "pytest>=8,<10"

      - name: Compile Python sources
        run: python -m compileall -q gd_ai

      - name: Test motion detector
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_motion_detector.py
